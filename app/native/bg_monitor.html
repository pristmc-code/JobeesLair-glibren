<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Jobee'sLair · Downloads</title>
<style>
:root{--ink:#05070d;--deep:#090d16;--panel:#0f1520;--panel2:#151d2b;--raise:#1d2738;--line:#243047;--line-hi:#34445f;--fg:#f3f6fb;--muted:#aab4c6;--subtle:#7f8ca3;--accent:#3a86ff;--ice:#4cc9f0;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--ease:cubic-bezier(.2,.8,.2,1);--pad:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--fg);font:16px/1.45 "Exo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) 10px max(var(--pad),env(safe-area-inset-left));background:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand small{color:var(--subtle);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){ .status span{display:none} .status{gap:0} }
.status{margin-inline-start:auto;display:flex;align-items:center;gap:7px;color:var(--subtle);font-size:13px;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status.on i{background:var(--good);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.status.on{color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border:1px solid var(--line-hi);border-radius:8px;background:var(--raise);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.lock.open{border-color:rgba(74,222,128,.55);color:var(--good);background:transparent}
.lock svg{width:16px;height:16px}
.lock.gear{padding:6px 10px}
.lock.gear svg{width:18px;height:18px}
.pinned{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:1px solid var(--line)}
/* Fase 8: o caminho para a Jobe completa (/app), logo abaixo do cabecalho */
.applink{display:block;margin:6px max(var(--pad),env(safe-area-inset-right)) 6px max(var(--pad),env(safe-area-inset-left));padding:8px 12px;border:1px solid #3b6fd8;border-radius:8px;background:rgba(59,111,216,.16);color:var(--fg);font-size:14px;font-weight:600;text-decoration:none;text-align:center;overflow-wrap:anywhere}
.applink:focus{outline:3px solid #ffd34d;outline-offset:2px}
.pinned header{border-bottom:0}
.pinned.scrolled{box-shadow:0 8px 18px rgba(0,0,0,.55)}
.pinned .summary{margin:0 max(var(--pad),env(safe-area-inset-right)) 10px max(var(--pad),env(safe-area-inset-left))}
main{padding:12px max(var(--pad),env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.summary div{background:var(--panel);padding:9px 12px;display:flex;flex-direction:column;min-width:0}
.summary span{color:var(--subtle);font-size:12px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.summary b{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;grid-template-columns:1fr;gap:10px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.job.downloading{border-color:var(--line-hi)}
.top{display:flex;align-items:flex-start;gap:10px;min-width:0}
.name{font-weight:600;font-size:16px;line-height:1.3;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tag{margin-inline-start:auto;flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid var(--line-hi);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.downloading{color:var(--ice);border-color:rgba(76,201,240,.5)}
.tag.paused{color:var(--warn);border-color:rgba(251,191,36,.5)}
.tag.completed{color:var(--good);border-color:rgba(74,222,128,.5)}
.tag.failed{color:var(--bad);border-color:rgba(248,113,113,.55)}
.bar{position:relative;height:8px;background:var(--raise);border-radius:4px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;transition:width .6s var(--ease)}
.job.paused .bar>i{background:var(--warn)}
.job.completed .bar>i{background:var(--good)}
.job.failed .bar>i{background:var(--bad)}
.job.waiting-app .bar>i{background:var(--subtle)}
.wait{font-size:13.5px;color:var(--muted)}
.nums{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{color:var(--fg);font-weight:600}
.err{font-size:13.5px;color:#fecaca}
.actions{display:flex;gap:8px;margin-top:2px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--line-hi);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14.5px;color:var(--fg);background:var(--raise);cursor:pointer}
.btn svg{width:16px;height:16px}
.btn.danger{background:transparent;border-color:rgba(248,113,113,.6);color:#fecaca}
.btn.solid-danger{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.confirm{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid rgba(248,113,113,.5);border-radius:8px;background:rgba(127,29,29,.18);font-size:14px}
.confirm .row{display:flex;gap:8px}
.empty{grid-column:1/-1;padding:28px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line-hi);border-radius:10px}
.foot{color:var(--subtle);font-size:12.5px;text-align:center}
/* PIN */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(2,4,8,.72);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dialog{width:100%;max-width:340px;background:var(--panel2);border:1px solid var(--line-hi);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dialog h2{margin:0;font-size:18px}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.pin{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--deep);color:var(--fg);font-size:22px;letter-spacing:.5em;text-align:center;outline:none}
.pin:focus{border-color:var(--ice)}
.dialog .row{display:flex;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.msg{min-height:1.2em;font-size:13.5px;color:var(--bad)}
/* Pareamento por aparelho: texto sempre quebra linha (sem reticencias); botoes da mesma linha com a mesma largura. */
.plbl{font-size:13px;color:var(--subtle)}
.ptxt{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--deep);color:var(--fg);font-size:16px;outline:none}
.ptxt:focus{border-color:var(--ice)}
.plink{align-self:center;min-height:36px;padding:6px 10px;border:0;background:transparent;color:var(--ice);font-size:14px;text-decoration:underline;cursor:pointer;white-space:normal;text-align:center}
.dialog .row .btn,.pair-box .row .btn{flex:1 1 0;min-width:0;white-space:normal;overflow-wrap:anywhere}
.dialog h2,.dialog p,.msg{overflow-wrap:anywhere}
/* glibren.8: conexoes por download e downloads simultaneos, mudaveis com tudo baixando */
.conn,.ctlbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.conn{font-size:14px;color:var(--muted)}
.conn .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.conn .lbl small{color:var(--subtle);font-size:12px}
.ctlbar{margin:0 max(var(--pad),env(safe-area-inset-right)) 10px max(var(--pad),env(safe-area-inset-left));padding:6px 10px 6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--muted)}
.step{margin-inline-start:auto;display:inline-flex;align-items:stretch;border:1px solid var(--line-hi);border-radius:8px;overflow:hidden;flex:none}
.step button{width:36px;min-height:36px;border:0;background:var(--raise);color:var(--fg);font-size:20px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:54px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 6px;background:var(--deep);font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
.step output small{color:var(--subtle);font-weight:500}
.mode{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid var(--line-hi);color:var(--subtle);background:transparent;text-transform:uppercase;letter-spacing:.04em;cursor:default}
.mode.set{color:var(--ice);border-color:rgba(76,201,240,.5);cursor:pointer}
/* glibren.12: selos de origem (TorBox/AllDebrid ou o site do download direto) e formato, logo abaixo do nome */
.orig{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.oc{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0;padding:0 8px;border:1px solid;border-radius:999px;font-size:12px;font-weight:700;line-height:20px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc small{font-size:11px;font-weight:500;opacity:.8;text-transform:lowercase}
.oc svg{width:12px;height:12px;flex:none}
.oc.o-tb{color:#c4b5fd;border-color:rgba(167,139,250,.55);background:rgba(139,92,246,.16)}
.oc.o-ad{color:#fdba74;border-color:rgba(251,146,60,.55);background:rgba(234,88,12,.15)}
.oc.o-site{color:#7dd3fc;border-color:rgba(56,189,248,.5);background:rgba(14,165,233,.13)}
.oc.fx-best{color:#86efac;border-color:rgba(74,222,128,.55);background:rgba(34,197,94,.15)}
.oc.fx-img{color:#93c5fd;border-color:rgba(96,165,250,.5);background:rgba(59,130,246,.14)}
.oc.fx-pkg{color:#f9a8d4;border-color:rgba(244,114,182,.5);background:rgba(236,72,153,.13)}
.oc.fx-arc{color:#fde68a;border-color:rgba(253,224,71,.45);background:rgba(234,179,8,.12)}
.oc.s-ps5{color:var(--ice);border-color:rgba(76,201,240,.5);background:rgba(76,201,240,.1)}
.oc.s-ps4{color:#c4b5fd;border-color:rgba(196,181,253,.5);background:rgba(196,181,253,.1)}
.oc .cd{font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.fname{font-size:12.5px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.job.extracting .bar>i{background:repeating-linear-gradient(135deg,var(--ice) 0 10px,rgba(76,201,240,.45) 10px 20px);width:100%!important}
.tag.extracting{color:var(--ice);border-color:rgba(76,201,240,.5)}
/* glibren.12: secoes da aba Downloads. glibren.13: em pe, a linha tem 2 botoes lado a lado (velocidade maxima e secao),
   cada um abre a sua lista; deitado, os dois ficam no fim do resumo */
.secbar{display:flex;gap:8px;margin:0 max(var(--pad),env(safe-area-inset-right)) 10px max(var(--pad),env(safe-area-inset-left));min-width:0}
.list:empty,.convlist:empty{display:none}
.pick{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 10px;border:1px solid var(--line-hi);border-radius:8px;background:var(--raise);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-align:start}
.pick .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pick b{flex:none;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:12px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.pick i{flex:none;font-style:normal;color:var(--subtle);font-size:12px}
.pick.sec{border-color:var(--accent);background:rgba(58,134,255,.16)}
.pick.spd .t small{color:var(--subtle);font-weight:500;font-size:12.5px}
.pick.spd.capped{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.1)}
.pick.spd.capped .t{color:#fde68a}
.summary .secsel{display:none}
.secbtn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 10px;border:1px solid var(--accent);border-radius:8px;background:rgba(58,134,255,.16);color:var(--fg);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.secbtn b{font-weight:700}
.secbtn.spd{border-color:var(--line-hi);background:var(--raise)}
.secbtn.spd.capped{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.1);color:#fde68a}
.secmenu{position:fixed;z-index:22;min-width:210px;max-width:calc(100vw - 16px);max-height:80vh;overflow-y:auto;padding:4px;background:var(--panel2);border:1px solid var(--line-hi);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:2px}
.secmenu button{display:flex;justify-content:space-between;gap:12px;min-height:34px;padding:4px 10px;border:0;border-radius:7px;background:transparent;color:var(--fg);font-size:14px;cursor:pointer;text-align:start}
.secmenu button.on{background:var(--accent);color:#fff}
.secmenu button b{font-variant-numeric:tabular-nums;color:inherit;opacity:.85}
.secmenu .mh{padding:6px 10px 4px;color:var(--subtle);font-size:12px;line-height:1.3}
/* glibren.13: painel da velocidade maxima: − campo + (alvos de 44 px), Sem limite e Aplicar */
.secmenu.spdpanel{width:min(300px,calc(100vw - 16px));padding:8px;gap:8px}
.spdpanel .mh{padding:0 2px}
.sprow{display:flex;gap:8px;align-items:center;min-width:0}
.spdpanel .spk{flex:none;width:44px;height:44px;min-height:44px;padding:0;justify-content:center;align-items:center;border:1px solid var(--line-hi);border-radius:8px;background:var(--raise);color:var(--fg);font-size:24px;font-weight:700;line-height:1;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.spdpanel .spk:active{background:var(--line-hi)}
#speedInput{flex:1 1 auto;width:0;min-width:0;height:44px;padding:0 8px;border:1px solid var(--line-hi);border-radius:8px;background:var(--deep);color:var(--fg);font:inherit;font-size:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;outline:none}
#speedInput:focus{border-color:var(--ice)}
.spu{flex:none;color:var(--muted);font-size:13px}
.spdpanel .btn{min-height:44px;justify-content:center;background:var(--raise);border:1px solid var(--line-hi)}
.spdpanel .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.spdpanel .msg{min-height:0;padding:0 2px}
.cancelled{display:flex;flex-direction:column;gap:8px}
.cancelled .head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--subtle);font-size:13px}
.cancelled .head .btn{flex:none;min-height:34px}
.citem{display:flex;flex-direction:column;gap:5px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.citem .name{font-size:15px}
.citem small{color:var(--subtle);font-size:12.5px}
/* Celular deitado / telas largas: duas colunas e topo mais baixo */
/* Celular deitado / telas largas: duas colunas e topo mais baixo */
@media (orientation:landscape) and (max-height:520px){
  .summary{grid-template-columns:repeat(3,minmax(0,1fr)) auto}
  .summary .secsel{display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 8px}
  .secbar{display:none}
  .pinned .summary{margin-bottom:6px}
  header{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
  .brand small{display:none}
  main{padding-top:8px;gap:8px}
  .summary div{padding:5px 12px;flex-direction:row;align-items:baseline;gap:8px}
  .summary b{font-size:16px}
  .list{grid-template-columns:1fr 1fr;gap:8px}
  .job{padding:9px 12px;gap:5px}
  .name{font-size:15px;-webkit-line-clamp:1}
  .nums{font-size:13px}
  .btn{min-height:34px;padding:5px 10px;font-size:13.5px}
  .ctlbar{margin-bottom:6px;padding:3px 8px 3px 12px}
  .step button{min-height:30px}
}
@media (min-width:900px) and (min-height:521px){ .list{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ .bar>i{transition:none} }
.bk-log{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.bk-log .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk-log b{flex:1}
.bk-log pre{max-height:60vh;overflow:auto;margin:0;padding:10px;border-radius:10px;background:rgba(0,0,0,.35);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="pinned">
<header>
  <div class="brand"><b>Jobee'sLair</b><small id="sub">Downloads em segundo plano</small></div>
  <div class="status" id="status"><i></i><span id="statusText">Conectando…</span></div>
  <button class="lock" id="lock" type="button"></button>
  <button class="lock gear" id="gear" type="button" hidden aria-label="Trocar IP"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
  <a class="applink" id="appLink" href="/app">Abrir a Jobe completa →</a>
  <div class="summary">
    <div><span id="lblActive">Baixando</span><b id="sumActive">–</b></div>
    <div><span id="lblSpeed">Velocidade</span><b id="sumSpeed">–</b></div>
    <div><span id="lblLeft">Falta</span><b id="sumLeft">–</b></div>
    <div class="secsel"><button class="secbtn spd" type="button" id="speedBtn2" aria-haspopup="menu" hidden></button><button class="secbtn" type="button" id="secBtn" aria-haspopup="menu"></button></div>
  </div>
  <div class="ctlbar" id="ctlbar" hidden><span id="lblLimit">Downloads simultâneos</span><span class="mode set" id="limitMode" hidden></span>
    <div class="step"><button type="button" id="limitDown" aria-label="Menos">−</button><output id="limitVal">–</output><button type="button" id="limitUp" aria-label="Mais">+</button></div></div>
  <nav class="secbar" id="secbar" aria-label="Seções"><button class="pick spd" type="button" id="speedBtn" aria-haspopup="menu" hidden></button><button class="pick sec" type="button" id="secPick" aria-haspopup="menu"></button></nav>
</div>
<main>
  <div class="list" id="list"></div>
  <div class="cancelled" id="cancelledBox" hidden></div>
  <div class="foot" id="foot"></div>
</main>
<div class="sheet" id="sheet" hidden>
  <!-- Pareamento por aparelho (bg_pair.c): pedir o codigo (nome do aparelho) e digitar o codigo que o PS5 mostra. -->
  <form class="dialog" id="pairForm" hidden>
    <h2 id="pairTitle"></h2>
    <p id="pairText"></p>
    <label class="plbl" id="pairNameLbl" for="pairName"></label>
    <input class="ptxt" id="pairName" type="text" maxlength="40" autocomplete="off" spellcheck="false">

      save: "Save key", keySet: "Key set ✓, ends in …{t}", noKey: "No key saved.", remove: "Remove", removed: "Key removed.", saved: "Key saved.",
      send: "Send diagnostics", zip: "Download diagnostics (.zip)", zipWait: "Building the .zip…", zipFail: "The .zip could not be built. Try again.", zipApp: "The .zip only downloads in the phone's browser (the JobeControle app does not save files). Here, use Send diagnostics.",
      sending: "Sending… {n} of {t}", sent: "Sent ✓ (folder {f})", fail: "It did not work. Try again.",
      errors: { "no-key": "The GitHub key is missing: paste it above.", key: "That does not look like a GitHub key (github_pat_…).", busy: "A send is already running.",
        unauthorized: "Invalid or expired key (401). Create another and paste it above.", forbidden: "The key has no permission on the repository (403). Check Contents: Read and write.",
        "no-repo": "The key does not see the ps5-diagnosticos repository (404). Check the repository chosen for the key.", network: "No internet: the PS5 could not reach GitHub.",

<!-- glibren.49 (Fase 2): area "Payload de downloads": a versao em uso (embutida ou baixada e assinada), procurar e

<script>
"use strict";
(() => {
  const P = {
    pt: { title: "Payload de downloads (versão e atualização)", unlock: "Liberar os controles", running: "Em uso: {v} ({s})", embedded: "a que vem com a Jobe", downloaded: "baixada e assinada",
      latest: "Última conferida: {v}", update: "Procurar e atualizar o payload", revert: "Voltar ao payload embutido", fail: "Não deu. Tente de novo.",
      reverted: "Pronto: as versões baixadas ficaram de lado; o embutido volta quando nada estiver baixando.",
      phases: { checking: "Procurando a versão nova…", downloading: "Baixando {v}: {p}%", ready: "Versão {v} pronta: entra quando nada estiver baixando nem convertendo.",
        waiting: "Versão {v} pronta, esperando: {w} em andamento.", swapping: "Trocando para {v}…", current: "O payload já está na versão mais nova.",
        "needs-app": "A versão {v} precisa de uma Jobe mais nova: atualize a Jobe primeiro." },
      waits: { download: "download", convert: "conversão", quiet: "pausa depois de fechar o app" }, failed: "Não atualizou: {e}" },

      latest: "Last checked: {v}", update: "Look for and install a payload update", revert: "Back to the built-in payload", fail: "It did not work. Try again.",
      reverted: "Done: the downloaded versions were set aside; the built-in one comes back when nothing is downloading.",
      phases: { checking: "Looking for the new version…", downloading: "Downloading {v}: {p}%", ready: "Version {v} is ready: it takes over when nothing is downloading or converting.",
        waiting: "Version {v} is ready and waiting: {w} running.", swapping: "Switching to {v}…", current: "The payload is already on the newest version.",
        "needs-app": "Version {v} needs a newer Jobe: update Jobe first." },
      waits: { download: "a download", convert: "a conversion", quiet: "the pause after the app closed" }, failed: "Not updated: {e}" }
  }[L === T.pt ? "pt" : "en"];
  const fill = (text, vars) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
  const box = document.createElement("details"); box.className = "diag payload";
  const head = document.createElement("summary"); head.textContent = P.title;
  const body = document.createElement("div"); body.className = "dg-body";
  box.append(head, body);
  $("foot").before(box);
  let info = null, polling = null, msg = "", note = "";
  let demo = { ok: true, version: "1.33.0", source: "embedded", embedded: "1.33.0", installed: null, latest: "1.33.1", phase: "idle", percent: 0, error: "", waiting: "", bad: [] };
  async function call(method, path) {
    if (DEMO) {
      if (path === "/api/payload/update") Object.assign(demo, { phase: "downloading", percent: 42 });
      return { status: 200, data: { ...demo } };
    }
    return await api(method, path, method === "POST" ? {} : undefined).catch(() => ({ status: 0, data: {} }));
  }

    if (busy && !polling) polling = setInterval(load, 2000);
    if (!busy && polling) { clearInterval(polling); polling = null; }
    render();
  }
  async function act(path, after) {
    msg = ""; note = "";

    info = r.data;
    if (after) note = after;
    await load();
  }
  function line(text, cls = "dg-note") { const d = document.createElement("div"); d.className = cls; d.textContent = text; body.append(d); }
  function button(text, onclick, disabled, primary) { const b = document.createElement("button"); b.type = "button"; b.className = primary ? "btn primary" : "btn"; b.textContent = text; b.disabled = disabled; b.onclick = onclick; body.append(b); }

    if (note) line(note, "dg-ok");

</script>

  // ---- Incluir: um arquivo so vai direto; varios, escolhe (o recomendado ja marcado) ----

  // ---- Ficha do jogo: #jogo=<id> no endereco (voltar do celular/navegador fecha); fotos em tela cheia: #jogo=<id>/fotos/<n> ----

  function section(cls, title) { const s = el("section", `fsec ${cls}`); if (title) s.append(el("h3", "", title)); return s; }

    if (okURL(d.hero)) { $("stHero").hidden = false; $("stHero").textContent = ""; picture($("stHero"), [d.hero], false); }
    const grid = el("div", "fgrid"), left = el("div", "fcol"), right = el("div", "fcol");
    grid.append(left, right); body.append(grid);
    const top = el("div", "ftop"), meta = el("div", "fmeta");
    top.append(coverBox(g, 440, false), meta);
    meta.append(el("h2", "", g.title));
    const m = el("div", "m"); metaOf(g, m); meta.append(m);
    if (g.stars) { const r = el("div", "m"), s = el("span", "score"); s.append(el("i", "", "★"), document.createTextNode(` ${nf(g.stars, 1)}`)); s.title = S.stars; r.append(s); meta.append(r); }
    left.append(top);
    const get = el("div", "fget"), b = el("button", "btn primary get"); b.type = "button";
    const note = el("small");
    get.append(b, note); left.append(get);
    fx.button = b; paint(g, state === "loading");
    if (state === "loading") { left.append(el("div", "fmsg", S.loadingGame)); return; }
    note.textContent = data.download === "payload" ? S.willPayload : S.willApp;
    b.onclick = () => { if (!g.queued) guarded(() => add(g)); };
    // As fontes, na ordem da Jobe, com o selo "Jobe" nas que precisam dela aberta.
    if (data.links?.length) {
      const s = section("fs-files", S.sources), list = el("div", "files");
      for (const l of data.links) {
        const o = el("div", "fopt"), name = el("span", "", l.label || l.host || l.kind);
        o.append(name);
        const tags = el("small", "", [l.host && l.host !== l.label ? l.host : "", l.format ? l.format.toUpperCase() : "", l.parts > 1 ? fill(S.parts, { n: l.parts }) : "", l.size ? size(l.size) : ""].filter(Boolean).join(" · "));
        o.append(tags);
        if (!l.solo) o.append(jobeBadge());
        list.append(o);
      }
      s.append(list); left.append(s);
    }
    const shots = (d.shots || []).filter(okURL);
    if (shots.length) {
      const s = section("fs-shots", S.photos), strip = el("div", "shots");
      for (const url of shots) { const a = el("a", "shot"); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; picture(a, [url]); strip.append(a); }
      s.append(strip); right.append(s);
    }
    const paragraphs = [d.summary, ...(d.about || [])].filter((p, i, all) => p && all.indexOf(p) === i);
    if (paragraphs.length) {
      const s = section("fs-about", S.about), text = el("div", "about");
      for (const p of paragraphs) text.append(el("p", "", p));
      s.append(text);
      if (paragraphs.join(" ").length > 360) {
        text.classList.add("cut");
        const more = el("button", "linkbtn", S.readMore); more.type = "button";
        more.onclick = () => { const cut = text.classList.toggle("cut"); more.textContent = cut ? S.readMore : S.readLess; };
        s.append(more);
      }
      right.append(s);
    } else if (!data.details) right.append(el("div", "hint", S.noDetails));
    const facts = [[S.code, full.code], [S.platform, full.platform ? full.platform.toUpperCase() : ""], [S.sizeL, full.sizeGb ? gb(full.sizeGb) : ""],
      [S.formatsL, ranked(full.formats).map((f) => f.toUpperCase()).join(", ")], [S.genresL, (full.genres || []).join(", ")],
      [S.released, full.releaseDate ? new Date(`${full.releaseDate}T12:00:00`).toLocaleDateString(lang()) : ""], [S.developer, full.developer], [S.publisher, full.publisher],
      [S.stars, full.stars ? `${nf(full.stars, 2)} / 5${full.ratingCount ? ` · ${fill(S.ratings, { n: full.ratingCount.toLocaleString(lang()) })}` : ""}` : ""]].filter(([, v]) => v);
    if (facts.length) {
      const s = section("fs-facts", S.facts), dl = el("dl", "facts");
      for (const [k, v] of facts) dl.append(el("dt", "", k), el("dd", "", v));
      s.append(dl); left.append(s);
    }
  }
  if (location.hash === "#loja" || location.hash.startsWith("#loja=")) {
    const hash = location.hash;
    if (hash.startsWith("#loja=")) { try { history.replaceState(null, "", "#loja"); history.pushState({ jl: "loja" }, "", hash); } catch {} }
    show(true, true); routeStore();
  }
})();

.pair-box .pd{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.pair-box .pd:first-child{border-top:0}

.pair-box .pd .me{display:inline-block;margin-inline-start:6px;padding:0 6px;border:1px solid var(--ice);border-radius:999px;color:var(--ice);font-size:11.5px;font-weight:700}
.pair-box .row{display:flex;gap:8px}
.pair-box .ask{font-size:14px;overflow-wrap:anywhere}

<script>
"use strict";
(() => {
  const box = document.createElement("details"); box.className = "diag pair-box"; box.id = "pairBox";
  const head = document.createElement("summary"); head.textContent = PL.devices;
  const body = document.createElement("div"); body.className = "dg-body";
  box.append(head, body);
  $("foot").before(box);
  let data = null, need = false, asking = "", msg = "";
  const demo = { devices: [{ id: "0123456789abcdef", name: "Android", at: Math.floor(Date.now() / 1000) - 86400, self: true }, { id: "fedcba9876543210", name: "PC Windows", at: Math.floor(Date.now() / 1000) - 3600, self: false }], pinOn: true, pinSet: true };
  async function call(method, path, payload) {
    if (DEMO) {
      if (path === "/api/pair/remove") demo.devices = demo.devices.filter((d) => d.id !== payload.id);
      if (path === "/api/pair/pin") demo.pinOn = payload.on;
      return { status: 200, data: { ok: true, devices: demo.devices.map((d) => ({ ...d })), pinOn: demo.pinOn, pinSet: demo.pinSet } };
    }
    return await api(method, path, payload).catch(() => ({ status: 0, data: {} }));
  }
  const line = (text, cls) => { const d = document.createElement("div"); d.className = cls || "dg-note"; d.textContent = text; body.append(d); return d; };
  const button = (text, cls, onclick) => { const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = text; b.onclick = onclick; return b; };
  const when = (at) => { try { return new Date(at * 1000).toLocaleDateString(document.documentElement.lang); } catch { return ""; } };
  async function load() {
    const r = await call("GET", "/api/pair/devices");
    need = r.status === 401;
    data = r.status === 200 ? r.data : null;
    render();
  }
  async function remove(dev) {
    asking = ""; msg = "";
    const r = await call("POST", "/api/pair/remove", { id: dev.id });
    if (r.status === 401) { need = true; render(); return; }
    if (r.status !== 200) { msg = PL.failed; render(); return; }
    if (r.data && r.data.self === true) { session = ""; lockButton(); data = null; need = true; render(); openPair(PL.removedSelf); return; }
    await load();
  }
  async function setPin(on) {
    msg = "";
    const r = await call("POST", "/api/pair/pin", { on });
    if (r.status === 401) { need = true; render(); return; }
    if (r.status !== 200) { msg = PL.failed; render(); return; }
    pinOn = on;
    await load();
  }
  function render() {
    body.textContent = "";
    if (session === "local") line(PL.local, "dg-ok");
    if (need || (!session && !DEMO)) {
      line(PL.needPair);
      const row = document.createElement("div"); row.className = "row";
      row.append(button(PL.title, "btn primary", () => openPair("")));
      body.append(row);
    } else if (data) {
      const list = Array.isArray(data.devices) ? data.devices : [];
      if (!list.length) line(PL.none);
      for (const dev of list) {
        const item = document.createElement("div"); item.className = "pd";
        const name = document.createElement("b"); name.textContent = String(dev.name || "");
        if (dev.self === true) { const me = document.createElement("span"); me.className = "me"; me.textContent = PL.self; name.append(me); }
        const at = document.createElement("small"); at.textContent = pfill(PL.pairedOn, { d: when(Number(dev.at) || 0) });
        item.append(name, at);
        if (asking === dev.id) {
          const ask = document.createElement("div"); ask.className = "ask"; ask.textContent = pfill(PL.removeAsk, { name: String(dev.name || "") });
          const row = document.createElement("div"); row.className = "row";
          row.append(button(PL.no, "btn", () => { asking = ""; render(); }), button(PL.yes, "btn solid-danger", () => remove(dev)));
          item.append(ask, row);
        } else {
          const row = document.createElement("div"); row.className = "row";
          row.append(button(PL.remove, "btn danger", () => { asking = dev.id; render(); }));
          item.append(row);
        }
        body.append(item);
      }
      // O PIN antigo: so quando ha um definido na Jobee'sLair ou ele ja foi desligado.
      if (data.pinSet === true || data.pinOn === false) {
        line(data.pinOn === false ? PL.pinOff : PL.pinOn, data.pinOn === false ? "dg-ok" : "dg-note");
        const row = document.createElement("div"); row.className = "row";
        row.append(button(data.pinOn === false ? PL.pinTurnOn : PL.pinTurnOff, "btn", () => setPin(data.pinOn === false)));
        body.append(row);
      }
    }
    if (msg) line(msg, "dg-err");
  }
  window.openDevices = () => { box.open = true; load(); box.scrollIntoView({ block: "start", behavior: "smooth" }); };
  window.pairHook = () => { if (box.open) load(); else render(); };
  box.addEventListener("toggle", () => { if (box.open) load(); });
  render();
})();
</script>
