<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Jobee'sLair · Testes</title>
<!-- glibren.47: a pagina de testes da Fase 0 (ps5/ESTUDO-jobe-como-payload.md), servida pelo payload em /teste
     (app/native/bg_teste.c; embutida em bg_teste_html.h por tools/bg-monitor/embed.mjs). Mede no navegador do PS5 e no
     celular: tela cheia, controle (Gamepad API e teclado), a loja grande (/api/store inteira), a memoria do payload
     (/api/teste/estado) e o repouso. Usa a mesma sessao do PIN da pagina do celular (localStorage "jobe.session").
     JavaScript simples (sem ?. nem ??), para o navegador do PS5. ?demo = respostas falsas (prints). -->
<style>
:root{--ink:#05070d;--panel:#0f1520;--panel2:#151d2b;--raise:#1d2738;--line:#243047;--line-hi:#34445f;--fg:#f3f6fb;--muted:#aab4c6;--subtle:#7f8ca3;--accent:#3a86ff;--ice:#4cc9f0;--good:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
main{max-width:860px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) 28px max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:4px 0 0}
h2{font-size:17px;margin:0}
p,li,div,span,b,small,code{overflow-wrap:anywhere;word-break:normal}
.note{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.btn{min-height:44px;padding:8px 10px;border:1px solid var(--line-hi);border-radius:10px;background:var(--raise);color:var(--fg);font:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:normal;text-align:center;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.on{border-color:var(--good);color:var(--good);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.out{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;min-height:1.5em}
.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pin input{min-height:44px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line-hi);background:transparent;color:inherit;font:inherit;font-size:18px;letter-spacing:.2em}
.pads{display:flex;flex-direction:column;gap:8px}
.pad{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{min-width:34px;padding:2px 6px;border-radius:6px;background:var(--raise);text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.chip.down{background:var(--good);color:#05220f}
.keys{font-size:13px;max-height:9.5em;overflow:auto}
.store{height:46vh;min-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel2);-webkit-overflow-scrolling:touch}
.game{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:14px}
.game b{flex:1 1 auto;min-width:0;font-weight:500}
.game small{flex:0 0 auto;color:var(--subtle)}
textarea{width:100%;min-height:9em;border-radius:8px;border:1px solid var(--line-hi);background:var(--panel2);color:inherit;font:13px/1.4 ui-monospace,Consolas,monospace;padding:8px}
a{color:var(--ice)}
</style>
</head>
<body>
<main>
  <div>
    <h1 id="title"></h1>
    <p class="note" id="intro"></p>
    <p class="note"><a href="/" id="back"></a></p>
  </div>

  <section class="card" id="lockCard" hidden>
    <h2 id="pinTitle"></h2>
    <p class="note" id="pinText"></p>
    <div class="pin"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12"><button type="button" class="btn primary" id="pinGo"></button></div>
    <p class="out" id="pinMsg"></p>
  </section>

  <section class="card">
    <h2 id="fsTitle"></h2>
    <p class="note" id="fsText"></p>
    <div class="row"><button type="button" class="btn primary" id="fsGo"></button><button type="button" class="btn" id="fsExit"></button></div>
    <p class="out" id="fsOut"></p>
  </section>

  <section class="card">
    <h2 id="gpTitle"></h2>
    <p class="note" id="gpText"></p>
    <div class="row"><button type="button" class="btn primary" id="gpGo"></button><button type="button" class="btn" id="gpClear"></button></div>
    <div class="pads" id="gpPads"></div>
    <p class="out keys" id="gpKeys"></p>
  </section>

  <section class="card">
    <h2 id="stTitle"></h2>
    <p class="note" id="stText"></p>
    <div class="row"><button type="button" class="btn primary" id="stGo"></button><button type="button" class="btn" id="stScroll"></button></div>
    <p class="out" id="stOut"></p>
    <div class="store" id="stList" hidden></div>
  </section>

  <section class="card">
    <h2 id="memTitle"></h2>
    <p class="note" id="memText"></p>
    <div class="row"><button type="button" class="btn primary" id="memGo"></button></div>
    <p class="out" id="memOut"></p>
  </section>

  <section class="card">
    <h2 id="slTitle"></h2>
    <p class="note" id="slText"></p>
    <div class="row"><button type="button" class="btn primary" id="slGo"></button></div>
    <p class="out" id="slOut"></p>
  </section>

  <section class="card">
    <h2 id="ctTitle"></h2>
    <p class="note" id="ctText"></p>
    <div class="row"><button type="button" class="btn primary" id="ctGo"></button></div>
    <p class="out" id="ctOut"></p>
  </section>

  <section class="card">
    <h2 id="resTitle"></h2>
    <p class="note" id="resText"></p>
    <textarea id="resBox" readonly spellcheck="false"></textarea>
    <div class="row"><button type="button" class="btn primary" id="resCopy"></button><button type="button" class="btn" id="resSend"></button></div>
    <p class="out" id="resOut"></p>
  </section>
</main>

for (var key in L) { var el = $(key); if (el && typeof L[key] === "string" && el.tagName !== "INPUT") el.textContent = L[key]; }

// ---- O payload (ou o demo) --------------------------------------------------------------------------------
var demoPid = 4242, demoStart = Math.floor(Date.now() / 1000) - 3600, demoReq = 0;
function demoApi(method, path, body) {
  if (path === "/api/unlock") return body.pin === "1234" ? { status: 200, data: { session: "0123456789abcdef0123456789abcdef" } } : { status: 403, data: { retryIn: 0 } };
  if (path === "/api/teste/estado") { demoReq++; var t = Math.floor(Date.now() / 1000); return { status: 200, data: { ok: true, pid: demoPid, started: demoStart, uptimeSeconds: t - demoStart, now: t, version: "1.0.0", build: "demo", api: 32, rssBytes: (38 + demoReq) * 1048576, rssSource: "demo", peakBytes: (52 + demoReq) * 1048576, peakSource: "getrusage", requests: demoReq, lastRequest: demoReq > 1 ? t - 15 : null, previous: null } }; }

    return { status: 200, data: { ok: true, total: total, count: games.length, offset: off, limit: 200, games: games } };
  }
  if (path === "/api/teste/catalogo") return { status: 200, data: { ok: true, state: "ready", buildMs: 812.4, bytes: 2420459, peak: 9456546, limit: 33554432, rssBefore: 14311424, rssAfter: 22489408, rssNow: 22530368, rssAfterQueries: 22600000, listed: 2981, entries: 3198, phasesMs: { index: 40, tables: 8, feeds: 420, formats: 230, ratings: 2, texts: 60, sorts: 40, facets: 5 }, queries: [{ name: "pagina relevancia", status: 200, ms: 2.1, bytes: 30000 }, { name: "ficha", status: 200, ms: 140.2, bytes: 20000 }] } };
  if (path === "/api/teste/enviar") return { status: 200, data: { ok: true, state: "running" } };

// ---- 2. Controle ------------------------------------------------------------------------------------------
var gpOn = false, keyLog = [];
function padsNow() { try { return navigator.getGamepads ? Array.prototype.slice.call(navigator.getGamepads()).filter(Boolean) : null; } catch (e) { return null; } }
function drawPads() {
  if (!gpOn) return;

  if (pads === null) { box.textContent = L.gpNoApi; R.gamepad.api = false; }
  else if (!pads.length) { box.textContent = L.gpNone; R.gamepad.api = true; }
  else pads.forEach(function (pad) {
    R.gamepad.api = true;
    R.gamepad.seen[pad.id] = { mapping: pad.mapping || "(vazio)", buttons: pad.buttons.length, axes: pad.axes.length };
    var div = document.createElement("div"); div.className = "pad";
    var head = document.createElement("b"); head.textContent = "#" + pad.index + " " + pad.id + " · mapping " + (pad.mapping || "(vazio)"); div.append(head);
    var chips = document.createElement("div"); chips.className = "chips";
    pad.buttons.forEach(function (b, i) {
      var c = document.createElement("span"), down = b.pressed || b.value > 0.5;
      if (down) R.gamepad.pressed[i] = true;
      c.className = "chip" + (down ? " down" : ""); c.textContent = "B" + i + (b.value > 0 && b.value < 1 ? " " + b.value.toFixed(2) : ""); chips.append(c);
    });
    pad.axes.forEach(function (v, i) {
      if (Math.abs(v) > 0.5) R.gamepad.axesMoved[i] = true;
      var c = document.createElement("span"); c.className = "chip" + (Math.abs(v) > 0.5 ? " down" : ""); c.textContent = "E" + i + " " + v.toFixed(2); chips.append(c);
    });
    div.append(chips); box.append(div);
  });
  requestAnimationFrame(drawPads);
}
function onKey(e) {
  if (!gpOn) return;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Spacebar"].indexOf(e.key) >= 0 || [32, 37, 38, 39, 40].indexOf(e.keyCode) >= 0) e.preventDefault();
  var line = e.type + " code=" + (e.code || "-") + " key=" + (e.key || "-") + " keyCode=" + e.keyCode;
  R.gamepad.keys[(e.code || "-") + "/" + (e.key || "-") + "/" + e.keyCode] = true;
  keyLog.unshift(line); keyLog.length = Math.min(keyLog.length, 14);
  $("gpKeys").textContent = L.gpKeys + "\n" + keyLog.join("\n");
}
window.addEventListener("keydown", onKey, true);
window.addEventListener("keyup", onKey, true);
window.addEventListener("gamepadconnected", function (e) { keyLog.unshift("gamepadconnected #" + e.gamepad.index + " " + e.gamepad.id); });
$("gpGo").onclick = function () {
  gpOn = !gpOn; $("gpGo").textContent = gpOn ? L.gpStop : L.gpGo; $("gpGo").className = "btn " + (gpOn ? "on" : "primary");
  if (gpOn) requestAnimationFrame(drawPads); else results();
};
$("gpClear").onclick = function () { keyLog = []; $("gpKeys").textContent = ""; R.gamepad = { seen: {}, pressed: {}, axesMoved: {}, keys: {} }; results(); };

// ---- 4. Memoria (usada tambem pela loja) -------------------------------------------------------------------
function readMemory(label, slot) {
  return guardedGet("/api/teste/estado", function () { readMemory(label, slot); }).then(function (r) {
    if (!r) return null;
    if (r.status !== 200) { $("memOut").textContent = L.net; return null; }
    var d = r.data;
    R.memory[slot] = { rss: d.rssBytes, peak: d.peakBytes, source: d.rssSource, pid: d.pid, up: d.uptimeSeconds, api: d.api };
    var lines = [];
    [["before", L.memBefore], ["after", L.memAfter], ["now", L.memNow]].forEach(function (p) {
      var m = R.memory[p[0]]; if (m) lines.push(fill(L.memLine, { when: p[1], rss: mb(m.rss), peak: mb(m.peak), pid: m.pid, up: dur(m.up) }));
    });
    $("memOut").textContent = lines.join("\n");
    rest(d);
    results();
    return d;
  });
}
$("memGo").onclick = function () { readMemory(L.memNow, "now"); };

// ---- 3. Loja grande ---------------------------------------------------------------------------------------
var storeCount = 0;
function fetchStore() {
  var all = [], requests = 0, t0 = now();
  function page(offset) {
    return guardedGet("/api/store?offset=" + offset + "&limit=200", null).then(function (r) {
      requests++;
      if (!r || r.status === 404) return null;
      if (r.status !== 200) throw new Error("http " + r.status);
      all = all.concat(r.data.games || []);
      $("stOut").textContent = fill(L.stWait, { n: all.length, t: r.data.total });
      if (all.length < r.data.total && (r.data.games || []).length) return page(all.length);
      return { games: all, ms: Math.round(now() - t0), requests: requests };
    });
  }
  return page(0);
}
$("stGo").onclick = function () {
  $("stGo").disabled = true;
  readMemory(L.memBefore, "before").then(function () { return fetchStore(); }).then(function (got) {
    if (!got) { $("stOut").textContent = L.stNoStore; $("stGo").disabled = false; return; }
    var list = $("stList"), t0 = now();
    list.textContent = "";
    var frag = document.createDocumentFragment();
    got.games.forEach(function (g) {
      var row = document.createElement("div"); row.className = "game";
      var b = document.createElement("b"); b.textContent = g.title || g.id;
      var s = document.createElement("small"); s.textContent = (g.code || g.id || "") + " · " + (g.platform || "");
      row.append(b, s); frag.append(row);
    });
    list.append(frag); list.hidden = false;
    var built = Math.round(now() - t0);
    void list.offsetHeight;
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var drawn = Math.round(now() - t0);
      storeCount = got.games.length;
      R.store = { games: storeCount, fetchMs: got.ms, requests: got.requests, buildMs: built, drawnMs: drawn };
      $("stOut").textContent = fill(L.stDone, { n: storeCount, f: got.ms, p: got.requests, b: built, d: drawn });
      $("stGo").disabled = false;
      readMemory(L.memAfter, "after");
    }); });
  }).catch(function (e) { $("stOut").textContent = L.net + " " + (e && e.message || ""); $("stGo").disabled = false; });
};
// Quadros por segundo durante uma rolagem: conta os requestAnimationFrame e o maior intervalo entre eles.
function measure(seconds, step, done) {
  var frames = 0, max = 0, start = now(), last = start;
  function tick() {
    var t = now(); frames++; max = Math.max(max, t - last); last = t;
    if (step) step((t - start) / (seconds * 1000));
    if (t - start < seconds * 1000) requestAnimationFrame(tick);
    else done({ fps: Math.round(frames * 1000 / (t - start)), max: Math.round(max), n: frames, ms: Math.round(t - start) });
  }
  requestAnimationFrame(tick);
}
$("stScroll").onclick = function () {
  var list = $("stList");
  if (!storeCount) { $("stOut").textContent = L.stFirst; return; }
  list.scrollTop = 0;
  autoScroll = true;
  var range = list.scrollHeight - list.clientHeight;
  measure(6, function (f) { list.scrollTop = Math.min(1, f) * range; }, function (m) {
    setTimeout(function () { autoScroll = false; }, 200);
    R.store.auto = m;
    $("stOut").textContent = fill(L.stDone, { n: storeCount, f: R.store.fetchMs, p: R.store.requests, b: R.store.buildMs, d: R.store.drawnMs }) + "\n" + fill(L.stAuto, m) + (R.store.manual ? "\n" + fill(L.stManual, R.store.manual) : "");
    results();
  });
};
// Rolagem a mao: mede 1,5 s a partir do primeiro scroll (de novo a cada nova rolagem depois disso).
var manualBusy = false, autoScroll = false;
$("stList").addEventListener("scroll", function () {
  if (manualBusy || autoScroll || !storeCount || !R.store) return;
  manualBusy = true;
  measure(1.5, null, function (m) {
    manualBusy = false;
    R.store.manual = m;
    $("stOut").textContent = fill(L.stDone, { n: storeCount, f: R.store.fetchMs, p: R.store.requests, b: R.store.buildMs, d: R.store.drawnMs }) + (R.store.auto ? "\n" + fill(L.stAuto, R.store.auto) : "") + "\n" + fill(L.stManual, m);
    results();
  });
}, { passive: true });

// ---- 5. Repouso -------------------------------------------------------------------------------------------
var seen = null;
try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch (e) {}
// Compara o estado de agora com o visto antes (neste aparelho) e guarda o de agora.
function rest(d) {
  var lines = [], wall = d.now - d.started;
  if (seen && seen.pid) {
    if (seen.pid === d.pid && seen.started === d.started) lines.push(fill(L.slAlive, { pid: d.pid, up: dur(wall), mono: dur(d.uptimeSeconds) }));
    else lines.push(fill(L.slRestarted, { old: seen.pid, pid: d.pid, up: dur(wall) }));
    var last = d.lastRequest;
    if (!(seen.pid === d.pid && seen.started === d.started) && d.previous && d.previous.pid === seen.pid) last = d.previous.last;
    if (last) lines.push(fill(L.slGap, { gap: dur(d.now - last) }));
    R.rest = { seenPid: seen.pid, pid: d.pid, alive: seen.pid === d.pid && seen.started === d.started, wallUp: wall, monoUp: d.uptimeSeconds, gap: last ? d.now - last : null, markedAt: seen.marked || null, previous: d.previous };
  } else lines.push(L.slNone);
  $("slOut").textContent = lines.join("\n");
  seen = { pid: d.pid, started: d.started, at: d.now, marked: seen && seen.marked };
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}
$("slGo").onclick = function () {
  readMemory(L.memNow, "now").then(function (d) {
    if (!d) return;
    seen = { pid: d.pid, started: d.started, at: d.now, marked: d.now };
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
    $("slOut").textContent = fill(L.slMarked, { pid: d.pid, at: clock(d.now) });
    results();
  });
};
// A pagina aberta: um pedido a cada 15 s guarda a hora do ultimo pedido no payload; ao voltar a ficar visivel (o PS5
// acordou), le de novo e compara.
setInterval(function () { if (session && document.visibilityState !== "hidden") api("GET", "/api/teste/estado").then(function (r) { if (r.status === 200) rest(r.data); }); }, 15000);
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && session) readMemory(L.memNow, "now"); });

// ---- 6. Catalogo no payload (Fase 3) -----------------------------------------------------------------------
$("ctGo").onclick = function measureCatalog() {
  $("ctGo").disabled = true;
  guardedGet("/api/teste/catalogo", measureCatalog).then(function (r) {
    $("ctGo").disabled = false;
    if (!r) return;
    var d = r.data || {};
    if (r.status !== 200 || !d.listed) { $("ctOut").textContent = fill(L.ctNone, { state: d.state || r.status, detail: d.error ? ": " + d.error : "" }); R.catalog = { state: d.state || r.status, error: d.error || "" }; results(); return; }
    var phases = Object.keys(d.phasesMs || {}).map(function (k) { return k + " " + d.phasesMs[k]; }).join(", ");
    var lines = [fill(L.ctBuild, { ms: Math.round(d.buildMs), listed: d.listed, entries: d.entries, bytes: mb(d.bytes), peak: mb(d.peak), limit: mb(d.limit), before: mb(d.rssBefore), after: mb(d.rssAfter), now: mb(d.rssAfterQueries || d.rssNow) }), fill(L.ctPhases, { phases: phases })];
    (d.queries || []).forEach(function (q) { lines.push(fill(L.ctQuery, { name: q.name, ms: q.ms, kb: Math.round(q.bytes / 1024) })); });
    $("ctOut").textContent = lines.join("\n");
    R.catalog = d;
    results();
  });
};

// ---- Resultados -------------------------------------------------------------------------------------------
function results() {
  var g = R.gamepad, lines = [];
  lines.push("Jobee'sLair /teste (Fase 0) " + new Date().toISOString());
  lines.push("navegador: " + navigator.userAgent);
  lines.push("janela: " + window.innerWidth + "x" + window.innerHeight + ", tela " + screen.width + "x" + screen.height + ", dpr " + (window.devicePixelRatio || 1));
  lines.push("[1 tela cheia] " + (R.fullscreen ? R.fullscreen.method + ": " + R.fullscreen.result + " | antes: " + R.fullscreen.before + " | depois: " + R.fullscreen.after + (R.fullscreen.change ? " | eventos: " + R.fullscreen.change : "") : "nao feito"));
  var pads = Object.keys(g.seen);
  lines.push("[2 controle] gamepad api: " + (g.api === undefined ? "nao feito" : g.api ? "sim" : "nao") + "; controles: " + (pads.length ? pads.map(function (id) { var s = g.seen[id]; return id + " (mapping " + s.mapping + ", " + s.buttons + " botoes, " + s.axes + " eixos)"; }).join("; ") : "nenhum") +
    "; botoes apertados: " + (Object.keys(g.pressed).join(",") || "-") + "; eixos movidos: " + (Object.keys(g.axesMoved).join(",") || "-") + "; teclas (code/key/keyCode): " + (Object.keys(g.keys).join(" ") || "-"));
  var s = R.store;
  lines.push("[3 loja] " + (s ? s.games + " jogos; busca " + s.fetchMs + " ms em " + s.requests + " pedidos; montagem " + s.buildMs + " ms; ate desenhar " + s.drawnMs + " ms" + (s.auto ? "; rolagem auto " + s.auto.fps + " qps (pior quadro " + s.auto.max + " ms)" : "") + (s.manual ? "; rolagem manual " + s.manual.fps + " qps (pior quadro " + s.manual.max + " ms)" : "") : "nao feito"));
  var mem = ["before", "after", "now"].filter(function (k) { return R.memory[k]; }).map(function (k) { var m = R.memory[k]; return k + ": rss " + mb(m.rss) + " (" + (m.source || "-") + "), pico " + mb(m.peak) + ", pid " + m.pid + ", api " + m.api; });
  lines.push("[4 memoria] " + (mem.join("; ") || "nao feito"));
  var r = R.rest;
  lines.push("[5 repouso] " + (r ? (r.alive ? "continuou vivo" : "reiniciou") + " (pid visto " + r.seenPid + ", agora " + r.pid + "); ligado (relogio) " + dur(r.wallUp) + ", contador do processo " + dur(r.monoUp) + "; desde o ultimo pedido " + dur(r.gap) + (r.markedAt ? "; marcado as " + clock(r.markedAt) : "") + (r.previous ? "; processo anterior pid " + r.previous.pid + " ultimo pedido " + clock(r.previous.last) : "") : "nao feito"));
  var c = R.catalog;
  lines.push("[6 catalogo] " + (!c ? "nao feito" : !c.listed ? "sem catalogo: " + c.state + (c.error ? " (" + c.error + ")" : "") :
    "montagem " + Math.round(c.buildMs) + " ms; " + c.listed + " jogos, " + c.entries + " entradas; guarda " + mb(c.bytes) + ", pico " + mb(c.peak) + " (teto " + mb(c.limit) + "); rss " + mb(c.rssBefore) + " -> " + mb(c.rssAfter) + ", depois das consultas " + mb(c.rssAfterQueries) +
    "; fases " + Object.keys(c.phasesMs || {}).map(function (k) { return k + "=" + c.phasesMs[k]; }).join(",") + "; consultas " + (c.queries || []).map(function (q) { return q.name + "=" + q.ms + "ms"; }).join(", ")));
  $("resBox").value = lines.join("\n");
  return $("resBox").value;
}
$("resCopy").onclick = function () {
  var text = results(), box = $("resBox");
  var manual = function () { box.focus(); box.select(); try { box.setSelectionRange(0, text.length); } catch (e) {} var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} $("resOut").textContent = ok ? L.copied : L.copyManual; };
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { $("resOut").textContent = L.copied; }, manual);
  else manual();
};
var following = null;
function followDiag() {
  api("GET", "/api/diag").then(function (r) {
    var d = r.data || {};
    if (r.status === 200 && d.state === "running") { $("resOut").textContent = fill(L.sending, { n: d.sent || 0, t: d.total || "?" }); following = setTimeout(followDiag, 1500); return; }
    following = null;
    if (r.status === 200 && d.state === "done") $("resOut").textContent = fill(L.sent, { f: d.folder });
    else $("resOut").textContent = fill(L.sendFail, { e: d.error || r.status });
  });
}
$("resSend").onclick = function send() {
  var text = results().slice(0, 60000);
  api("POST", "/api/teste/enviar", { texto: text }).then(function (r) {
    if (r.status === 401) return needPin(send);
    if (r.status === 200) { $("resOut").textContent = fill(L.sending, { n: 0, t: "?" }); if (!following) followDiag(); return; }
    $("resOut").textContent = r.data.error === "no-key" ? L.noKey : r.data.error === "busy" ? L.busy : r.status === 0 ? L.net : fill(L.sendFail, { e: r.data.error || r.status });
  });
};

// Ao abrir: com sessao, le o estado (memoria + repouso); sem, pede o PIN.
results();
if (session || DEMO) readMemory(L.memNow, "now"); else needPin(function () { readMemory(L.memNow, "now"); });
</script>
</body>
